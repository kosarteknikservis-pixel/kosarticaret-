# Manuel: GitHub → Actions → "Canlıya gönder" → Run workflow
# Varsayılan: hızlı kod deploy (~2-4 dk). Ağır SEO/blog/görsel işleri ayrı açılır.

name: Canlıya gönder

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      onay:
        description: 'Onay için "canli" yazın'
        required: true
        default: ''
      blog_aktar:
        description: 'Blog kuyruğu / blog-export içe aktar (YAVAS)'
        required: true
        type: boolean
        default: false
      blog_kapak:
        description: 'Blog kapak görsellerini üret (YAVAS)'
        required: true
        type: boolean
        default: false
      gorsel_optimize:
        description: 'Depolanan görselleri optimize et (YAVAS)'
        required: true
        type: boolean
        default: false
      seo_toplu:
        description: 'SEO bulk-run + legal seed + brand seed (orta)'
        required: true
        type: boolean
        default: false
      analitik_sifirla:
        description: 'Müşteri hareketleri analitiğini sıfırla'
        required: true
        type: boolean
        default: false

concurrency:
  group: canliya-gonder
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.inputs.onay == 'canli'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: PHP 8.3 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Production bağımlılıklar
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Vite asset build
        run: |
          npm ci --prefer-offline
          npm run build

      - name: SSH anahtarı
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<'EOF'
          Host *
            ConnectTimeout 30
            ServerAliveInterval 20
            ServerAliveCountMax 6
            StrictHostKeyChecking no
          EOF

      - name: kosar/ kodunu sunucuya gönder
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          RSYNC="rsync -az --no-perms --omit-dir-times --timeout=120"
          EXCLUDE="--exclude .env --exclude database/database.sqlite --exclude storage/app/public --exclude storage/logs --exclude storage/framework --exclude node_modules --exclude .git --exclude tests --exclude deploy --exclude kosarticaret.com-audit --exclude tmp-gsc-*"

          for attempt in 1 2 3; do
            echo "Deneme $attempt/3..."
            $RSYNC $EXCLUDE ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/kosar/" && break
            [ $attempt -lt 3 ] && echo "Bağlantı hatası, ${attempt}0sn bekleniyor..." && sleep $((attempt * 30))
          done

      - name: public_html/ (css, js, giriş dosyaları)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          RSYNC="rsync -az --no-perms --omit-dir-times --timeout=60"
          $RSYNC public/css public/js public/build public/favicon.svg public/fonts \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/public_html/" 2>/dev/null || true
          scp deploy/public_html/index.php deploy/public_html/.htaccess \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/public_html/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -f ${DEPLOY_PATH}/public_html/robots.txt"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "ln -sfn ../kosar/storage/app/public ${DEPLOY_PATH}/public_html/storage"

      - name: Sunucuda migrate + önbellek
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            \$PHP_BIN artisan migrate --force && \
            \$PHP_BIN artisan cache:clear && \
            \$PHP_BIN artisan cache:forget seo.robots.txt && \
            \$PHP_BIN artisan config:cache && \
            \$PHP_BIN artisan route:cache && \
            \$PHP_BIN artisan view:cache && \
            echo 'Hizli deploy tamam (kod + migrate + cache)'"

      - name: SEO toplu isler (opsiyonel)
        if: github.event.inputs.seo_toplu == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            \$PHP_BIN artisan seo:assign-orphan-categories && \
            \$PHP_BIN artisan seo:bulk-run && \
            \$PHP_BIN artisan seo:seed-legal-pages --force && \
            \$PHP_BIN artisan seo:seed-brands --force"

      - name: Zamanlayıcı (hafif)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            \$PHP_BIN artisan schedule:run || true"

      - name: GSC API anahtarini sunucuya yaz
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GSC_JSON: ${{ secrets.GOOGLE_SEO_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GSC_JSON" ]; then
            echo "GOOGLE_SEO_CREDENTIALS_JSON yok; atlandi."
            exit 0
          fi
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}/kosar/storage/app/private && chmod 750 ${DEPLOY_PATH}/kosar/storage/app/private"
          printf '%s' "$GSC_JSON" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cat > ${DEPLOY_PATH}/kosar/storage/app/private/gsc-service-account.json && chmod 600 ${DEPLOY_PATH}/kosar/storage/app/private/gsc-service-account.json"

      - name: Müşteri hareketleri analitiğini sıfırla
        if: github.event.inputs.analitik_sifirla == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            \$PHP_BIN artisan analytics:reset --force"

      - name: Blog içeriklerini içe aktar (opsiyonel / YAVAS)
        if: github.event.inputs.blog_aktar == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            if [ -f database/blog-export.json ]; then \
              \$PHP_BIN artisan blog:import database/blog-export.json --force; \
            fi && \
            \$PHP_BIN artisan blog:publish-due --force --all || true"

      - name: Blog kapak görsellerini üret (opsiyonel / YAVAS)
        if: github.event.inputs.blog_kapak == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            \$PHP_BIN artisan blog:assign-covers --force"

      - name: Mevcut görselleri optimize et (opsiyonel / YAVAS)
        if: github.event.inputs.gorsel_optimize == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH}/kosar && \
            PHP_BIN=\$(command -v php || echo /usr/local/php83/bin/php) && \
            \$PHP_BIN artisan images:optimize-stored"
